[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "data-room-organizer"
version = "0.0.1"
description = "Turn a pile of documents into an organized, diligence-ready data room: classified, shelved without touching the originals, indexed, logged, and checked for what is missing."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Edward Scannell" }]
keywords = ["data-room", "documents", "diligence", "filing", "organization", "metadata"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.6", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
dataroom = "data_room_organizer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/data_room_organizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "regression: a real incident turned into a permanent test",
    "business_case: a requirement expressed as an executable gate",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["data_room_organizer"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["data_room_organizer"]
branch = true
